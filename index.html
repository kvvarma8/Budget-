<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Budget</title>
<meta name="referrer" content="no-referrer">
<!--
  Family Budget (with automatic sync): a private, local-first budget tracker.
  Data lives in this browser's localStorage under "family-budget:v2" (older "family-budget:v1" data is read once and kept).
  Automatic sync is peer-to-peer over WebRTC. Public Nostr relays are used only so devices can find each other; they see a
  hashed room name and connection offers encrypted with the room password, never budget data. Budget data goes directly
  between devices and is additionally encrypted with AES-256-GCM using a key derived from the Room ID and password.
  Bundled inline: Trystero 0.26.0 (MIT, https://github.com/dmotz/trystero) and its dependencies.
  Loaded from CDN on first open, then cached by the browser: React, ReactDOM, Tailwind (browser build), Lucide icons.
-->
<style>
  /* Layout: single column on phones, summary row + two-column work area (budgets | add entry) + full-width log on desktop. */
  :root {
    --bg: #f4f5f1;
    --surface: #ffffff;
    --surface-2: #eceee8;
    --line: #dcdfd6;
    --fg: #1d221f;
    --muted: #626b65;
    --accent: #2d4f9e;
    --accent-fg: #ffffff;
    --accent-soft: #e3e9f7;
    --income: #1c7a50;
    --income-soft: #dff1e7;
    --expense: #b3412b;
    --expense-soft: #f8e4de;
    --warn: #9a6400;
    --warn-soft: #f8ecd2;
    --danger: #c42b3a;
    --danger-soft: #f9dfe2;
    --shadow: 0 1px 2px rgba(20, 30, 25, .06), 0 4px 16px rgba(20, 30, 25, .05);
    --font-ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-num: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121513; --surface: #1a1e1b; --surface-2: #232824; --line: #313732;
      --fg: #e7ebe6; --muted: #9aa49c; --accent: #8fa8ff; --accent-fg: #0f1530; --accent-soft: #232c4a;
      --income: #5fd19a; --income-soft: #183326; --expense: #f08a72; --expense-soft: #3a211b;
      --warn: #f0bd5a; --warn-soft: #3a2f17; --danger: #ff7b86; --danger-soft: #3d1c21;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121513; --surface: #1a1e1b; --surface-2: #232824; --line: #313732;
    --fg: #e7ebe6; --muted: #9aa49c; --accent: #8fa8ff; --accent-fg: #0f1530; --accent-soft: #232c4a;
    --income: #5fd19a; --income-soft: #183326; --expense: #f08a72; --expense-soft: #3a211b;
    --warn: #f0bd5a; --warn-soft: #3a2f17; --danger: #ff7b86; --danger-soft: #3d1c21;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 15px; line-height: 1.45; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .label { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1, h2, h3 { text-wrap: balance; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .field { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; min-width: 0; }
  .field:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
  .btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-danger:hover { background: var(--danger); filter: brightness(1.08); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; color: var(--muted); background: transparent; border: 0; cursor: pointer; }
  .icon-btn:hover { background: var(--surface-2); color: var(--fg); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 7px 10px; border-radius: 8px; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .scrim { position: fixed; inset: 0; background: rgba(10, 14, 12, .45); display: grid; place-items: end center; z-index: 50; padding: 0; }
  .sheet { background: var(--surface); color: var(--fg); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); box-shadow: var(--shadow); }
  @media (min-width: 640px) { .scrim { place-items: center; padding: 24px; } .sheet { border-radius: 18px; padding: 24px; } }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: calc(100% - 32px); font-size: 14px; }
  .toast button { color: inherit; background: transparent; border: 0; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .tbl th.text-right { text-align: right; }
  .tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl tr:last-child td { border-bottom: 0; }
  .tbl tbody tr:hover { background: var(--surface-2); }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: var(--fg); box-shadow: inset 0 0 0 2px var(--surface); }
  #boot { padding: 48px 16px; text-align: center; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .dot-lg { width: 12px; height: 12px; }
  .dot-live { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .sync-pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; letter-spacing: 0; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; vertical-align: middle; }
  .sync-pill:hover { background: var(--surface-2); }
  .tag-synced { display: inline-grid; place-items: center; width: 18px; height: 18px; margin-left: 6px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); vertical-align: -3px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

/* ---------- conflict-free merge ----------
   Every category and transaction is its own record, stamped with a logical clock (t) and the device that wrote it (by).
   Deleting writes a tombstone instead of removing the record. Merging keeps, for each id, the record with the highest
   (t, by), so two devices always end up identical no matter in which order changes arrive. Entries logged at the same
   moment on two phones have different ids, so both are kept. */
let lastStamp = 0;

    observe(d.currency.t);
    const w = winner(s.currency, d.currency);
    if (!same(w, s.currency)) out = {
      ...out,
      currency: w
    };

  for (const kind of ["categories", "transactions"]) {
    if (!d[kind]) continue;
    let map = null;
    for (const [id, rec] of Object.entries(d[kind])) {
      observe(rec.t);
      const cur = s[kind][id];
      const w = winner(cur, rec);
      if (!cur || !same(w, cur)) {
        map = map || {
          ...s[kind]
        };
        map[id] = w;

      ...out,
      [kind]: map
    };

const live = map => Object.values(map).filter(r => !r.deleted);

/* ---------- validation (localStorage, imports and every message from another device) ---------- */
const cleanT = (t, fallback) => {

    id: String(c.id || uid()),
    t: cleanT(c.t, 1),
    by: typeof c.by === "string" ? c.by.slice(0, 40) : legacy
  };
  if (c.deleted === true) return {
    ...base,
    deleted: true
  };
  if (typeof c.name !== "string" || !c.name.trim()) return null;
  const kind = c.kind === "income" ? "income" : "expense";
  const budget = Math.max(0, Number(c.budget) || 0);
  return {
    ...base,
    name: c.name.trim().slice(0, 60),
    kind,
    budget: kind === "expense" ? round2(budget) : 0,
    color: /^#[0-9a-f]{6}$/i.test(c.color || "") ? c.color : COLORS[i % COLORS.length]
  };
}
function cleanTx(t, i, legacy) {
  if (!t || typeof t !== "object") return null;
  const base = {
    id: String(t.id || uid()),
    t: cleanT(t.t, 1),
    by: typeof t.by === "string" ? t.by.slice(0, 40) : legacy
  };
  if (t.deleted === true) return {
    ...base,
    deleted: true
  };
  if (t.type !== "income" && t.type !== "expense") return null;
  const amount = Number(t.amount);
  if (!isFinite(amount) || amount <= 0 || amount > 1e12) return null;
  if (typeof t.date !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(t.date)) return null;
  const rec = {
    ...base,
    type: t.type,
    amount: round2(amount),
    date: t.date,
    categoryId: t.categoryId ? String(t.categoryId) : null,
    note: typeof t.note === "string" ? t.note.slice(0, 200) : ""

}
function cleanMap(input, cleaner, legacy, label, strict) {
  const list = Array.isArray(input) ? input : input && typeof input === "object" ? Object.values(input) : null;
  if (!list) throw new Error(`The file is missing ${label}, so it isn't a Family Budget export.`);
  const map = {};
  list.forEach((r, i) => {
    const c = cleaner(r, i, legacy);
    if (!c) {
      if (strict) throw new Error(`${label === "categories" ? "Category" : "Transaction"} ${i + 1} is damaged or incomplete.`);
      return;

    value: c.value,
    t: cleanT(c.t, 1),
    by: typeof c.by === "string" ? c.by : "legacy"
  };

    value: CURRENCIES.includes(legacyValue) ? legacyValue : "USD",

// Accepts this app's v1 (arrays) and v2 (record maps) formats.
function validateBudget(raw, {
  strict = true
} = {}) {
  if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("The file doesn't contain budget data.");
  if (raw.app && raw.app !== APP_ID) throw new Error("This file was made by a different app.");
  if (typeof raw.version === "number" && raw.version > SCHEMA_VERSION) throw new Error("This file comes from a newer version of the app. Ask your partner to send you their copy of the HTML file.");
  return {
    app: APP_ID,
    version: SCHEMA_VERSION,
    currency: cleanCurrency(raw.currency, raw.currency),
    categories: cleanMap(raw.categories, cleanCategory, "legacy", "categories", strict),

  if (d.transactions) out.transactions = cleanMap(d.transactions, cleanTx, "peer", "transactions", false);
